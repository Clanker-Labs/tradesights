# tradesights: the MCP server, and the research dashboard.
#
# network_mode: host for the same reason as the other MCP servers in this
# ecosystem — LeClanker is on the bridge network and reaches these through
# host.docker.internal, which only resolves to the real port when the server
# binds the host namespace.
#
# A plain GET to /mcp answers 406: the endpoint wants the MCP handshake and
# correctly refuses anything else. That makes 406 the STRONGER health signal —
# it proves the MCP app is answering, where a 200 could come from anything that
# took the port.
services:
  tradesights-mcp:
    build: .
    image: tradesights-mcp:latest
    container_name: tradesights-mcp
    network_mode: host
    restart: unless-stopped
    environment:
      TRADESIGHTS_MCP_PORT: ${TRADESIGHTS_MCP_PORT:-8094}
      TRADESIGHTS_TELEGRAM_CHAT: ${TRADESIGHTS_TELEGRAM_CHAT:-}
      # The MCP's archive tools read and WRITE the same database as the
      # dashboard, the CLI and the snapshot timer. Giving this mount to the
      # dashboard alone -- which is what the first version did -- left the
      # agent's tools reading an empty container-local database: it reported
      # "0 sessions recorded" while the dashboard beside it showed the real
      # archive, and `tradesights_record` wrote into a filesystem that dies on
      # the next restart. Nothing errored. Both services need it or neither
      # does.
      TRADESIGHTS_DB: /archive/history.db
      FRED_API_KEY: ${FRED_API_KEY:-}
      NEWSAPI_API_KEY: ${NEWSAPI_API_KEY:-}
      TWITTERAPI_API_KEY: ${TWITTERAPI_API_KEY:-}
    volumes:
      - ${TRADESIGHTS_ARCHIVE:-./.archive}:/archive
    healthcheck:
      test: ["CMD-SHELL", 'curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${TRADESIGHTS_MCP_PORT:-8094}/mcp" | grep -qE "^(200|406)$$"']
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3

  # The research dashboard on :8095. Host namespace like the MCP, for a
  # different reason: it reads the snapshot archive from a bind-mounted host
  # directory, and the Tailscale sidecar in chezmoi proxies 127.0.0.1:8095 —
  # both of which want the same network view as everything else on the box.
  #
  # It cannot place an order. No route takes a side or a size, and the module
  # does not import anything that can send. That is the property that makes
  # leaving it unauthenticated a defensible choice rather than an oversight —
  # the worst outcome of an unexpected visitor is a stale chart.
  tradesights-dashboard:
    build: .
    image: tradesights-mcp:latest
    container_name: tradesights-dashboard
    network_mode: host
    restart: unless-stopped
    command: ["python", "-m", "tradesights.cli", "dashboard",
              "--host", "127.0.0.1", "--port", "${TRADESIGHTS_DASHBOARD_PORT:-8095}"]
    environment:
      # The archive is the whole point of the dashboard, and it lives on the
      # host so that `tradesights snapshot` from a cron, from the CLI and from
      # the container all write to the same database. A container-local path
      # would give the dashboard a private, permanently empty archive while
      # every other writer filled the real one.
      TRADESIGHTS_DB: /archive/history.db
    volumes:
      # NOT `~/.tradesights` as the fallback: compose does not expand a tilde in
      # a volume source, it treats the whole thing as a relative path and
      # silently creates a directory literally named `~` inside the repo. The
      # archive would then be somewhere nobody looks, and everything would
      # appear to work. chezmoi's 50-configure.sh writes an absolute path here;
      # the fallback is repo-local and obvious.
      - ${TRADESIGHTS_ARCHIVE:-./.archive}:/archive
    healthcheck:
      test: ["CMD-SHELL", 'curl -fsS "http://127.0.0.1:${TRADESIGHTS_DASHBOARD_PORT:-8095}/api/health" >/dev/null']
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
