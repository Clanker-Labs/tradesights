# The tradesights MCP server.
#
# network_mode: host for the same reason as the other MCP servers in this
# ecosystem — LeClanker is on the bridge network and reaches these through
# host.docker.internal, which only resolves to the real port when the server
# binds the host namespace.
#
# A plain GET to /mcp answers 406: the endpoint wants the MCP handshake and
# correctly refuses anything else. That makes 406 the STRONGER health signal —
# it proves the MCP app is answering, where a 200 could come from anything that
# took the port.
services:
  tradesights-mcp:
    build: .
    image: tradesights-mcp:latest
    container_name: tradesights-mcp
    network_mode: host
    restart: unless-stopped
    environment:
      TRADESIGHTS_MCP_PORT: ${TRADESIGHTS_MCP_PORT:-8094}
      TRADESIGHTS_TELEGRAM_CHAT: ${TRADESIGHTS_TELEGRAM_CHAT:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      NEWSAPI_API_KEY: ${NEWSAPI_API_KEY:-}
      TWITTERAPI_API_KEY: ${TWITTERAPI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", 'curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${TRADESIGHTS_MCP_PORT:-8094}/mcp" | grep -qE "^(200|406)$$"']
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
